# kitty configuration (managed by chezmoi).

# Send Shift+Enter as its CSI-u encoding (ESC[13;2u) unconditionally.
# kitty only emits this once an app enables the kitty keyboard protocol;
# tmux never does, so without this map Shift+Enter reaches tmux as a plain
# carriage return and apps like Claude Code submit instead of inserting a
# newline. tmux (extended-keys always + csi-u) passes the sequence through.
# Side effect: Shift+Enter at a bare shell prompt types stray characters
# instead of acting as Enter.
map shift+enter send_text all \x1b[13;2u
