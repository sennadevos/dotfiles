# MarkText (Electron moves itself into app-marktext-<pid>.scope; this
# truncated-prefix drop-in matches every such scope).
#
# 0.19.1 sometimes balloons memory without bound when closing a window through
# the unsaved-changes dialog (observed: 16 GB address space, minutes of
# system-wide thrash). Cap the scope so the kernel OOM-kills MarkText itself
# within seconds instead of taking the machine down.
[Scope]
MemoryMax=4G
MemorySwapMax=0
