# tmux configuration (managed by chezmoi).

# Mouse everywhere: click to select panes, drag borders to resize, wheel to
# enter/scroll the scrollback, click-drag to select text.
set -g mouse on

# --- Copy mode: vi ------------------------------------------------------
# prefix-[ enters copy mode; navigate with hjkl/w/b//, select with v/V/C-v.
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Yank straight to the system clipboard instead of tmux's internal buffer,
# for both keyboard (y) and mouse-drag selections.
# wl-copy is the Wayland clipboard tool; swap for xclip (X11) or pbcopy
# (macOS) on other systems.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- Panes: same hjkl language outside copy mode ------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Shifted variants resize; -r keeps them repeatable within repeat-time.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits open in the current pane's directory rather than the session root.
# s stacks (tmux "vertical"), v puts panes side by side (tmux "horizontal").
# Note: s shadows the default choose-tree binding (session picker).
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Window cycling on repeatable C-h/C-l: hold prefix once, then tap away.
bind -r C-h previous-window
bind -r C-l next-window

# --- vim-tmux-navigator (christoomey) -----------------------------------
# C-h/j/k/l move between panes, except when the pane runs vim/neovim, where
# the key is forwarded so vim moves between its own splits instead. One set
# of keys crosses both boundaries. The vim half is the plugin itself, added
# in nvim/lua/config/plugins.lua.
#
# These are root-table bindings (-n, no prefix), so the prefix C-h/C-l
# window cycling above is untouched: bare C-h moves a pane, prefix C-h
# changes window.
#
# is_vim inspects the process running on the pane's tty. The upstream
# snippet wraps the C-\ binding in a bc-based tmux version test; this is
# tmux 3.7b, so only the >= 3.0 form is kept and bc is not needed.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# In copy mode the keys are plain pane movement: there is no vim to forward
# to, and copy-mode-vi already uses hjkl for cursor motion.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# --- Extended keys ------------------------------------------------------
# kitty natively encodes combos like Shift+Enter as CSI-u sequences
# (ESC [13;2u). Without this, tmux flattens them to plain Enter. "always"
# forwards them even to programs that never request the protocol.
set -s extended-keys always
set -as terminal-features 'xterm-kitty:extkeys'
# Re-encode extended keys to panes in kitty's CSI-u form (ESC[13;2u), not
# the default xterm modifyOtherKeys form (ESC[27;2;13~), which apps like
# Claude Code don't parse. Legacy keys (e.g. Shift+Tab = ESC[Z) untouched.
set -s extended-keys-format csi-u
