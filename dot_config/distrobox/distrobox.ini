# Distrobox assemble manifest.
# Create/update all boxes with:
#   distrobox assemble create --file ~/.config/distrobox/distrobox.ini

# ESP-IDF development box, based on the official Espressif image.
# The image ships the full toolchain with IDF_PATH=/opt/esp/idf.
# Tags: release-vX.Y tracks a stable branch; "latest" tracks master.
# /dev is shared by default, so /dev/ttyUSB*//dev/ttyACM* flashing works
# as long as your host user may access the device (dialout group/udev).
[esp-idf]
image=docker.io/espressif/idf:release-v5.5
pull=true
additional_packages="zsh neovim"
init_hooks="echo . /opt/esp/idf/export.sh > /etc/profile.d/esp-idf.sh"

# General GUI application box. Keeps desktop apps off the ostree image, where
# layering them would mean an rpm-ostree rebase and a reboot. Chromium lives
# here and is exported to the host as the default browser.
#
# Chromium is exported to the host with four flags, all load-bearing. Re-export
# with:
#
#   distrobox enter apps -- distrobox-export --app chromium-browser \
#     --extra-flags "--user-data-dir=$HOME/.local/share/chromium \
#                    --remote-debugging-port=9222 \
#                    --ozone-platform-hint=auto --no-first-run"
#
# Two of them are non-obvious, and dropping either kills remote debugging with
# no error message at all:
#
#   user-data-dir  151 refuses DevTools remote debugging on the default profile
#                  ("requires a non-default data directory"). The path must be
#                  spelled out absolutely, since desktop Exec is not shell
#                  expanded and would treat $HOME literally. It lives under the
#                  host home that distrobox mounts, so the profile survives
#                  rebuilding or deleting this box.
#   no-first-run   while the first-run experience is pending, Chromium never
#                  opens the debugging port and logs nothing about it. Verified:
#                  same command with the flag binds the port, without it does
#                  not. A profile reset would otherwise silently end CDP.
#
# ozone-platform-hint keeps it on Wayland under niri rather than XWayland.
#
# remote-debugging-port is a *session-startup* flag, and Chromium runs one
# process per user-data-dir: whichever launcher claims the profile first owns
# the session, and every later invocation just forwards its request and exits
# with its own flags silently discarded ("Opening in existing browser
# session."). So it is not enough for the browser entry to carry the flag --
# EVERY launcher sharing this profile must, or CDP is off whenever something
# else got there first. In practice that means the hand-made PWA entries in
# ~/.local/share/applications/chrome-<app_id>-Default.desktop too; a PWA
# autostarting at login is enough to leave Super+B without a debugging port.
[apps]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
additional_packages="chromium"

# Python data-analysis box (pandas/numpy/matplotlib/scipy/seaborn, openpyxl
# for Excel, pdfplumber + poppler-utils/pdftotext for PDF extraction,
# jupyterlab). Keeps the toolchain off the ostree image.
#
# The image ships the same Python minor version as the host (3.14), so a
# `pip install --user` in here would land in the shared ~/.local/lib/python3.14
# that the host and the esp-idf box already use. Project packages therefore go
# in a venv inside the workspace instead:
#
#   distrobox enter python -- python3 -m venv ~/Desktop/Finance_Playground/.venv
#   distrobox enter python -- ~/Desktop/Finance_Playground/.venv/bin/pip install \
#     pandas numpy matplotlib openpyxl pdfplumber scipy seaborn jupyterlab
#
# Run a script with:
#   distrobox enter python -- ~/Desktop/Finance_Playground/.venv/bin/python script.py
[python]
image=registry.fedoraproject.org/fedora-toolbox:latest
pull=true
additional_packages="python3 python3-pip python3-devel poppler-utils zsh neovim git"
