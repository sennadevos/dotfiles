# Overrides niri's vendor portal config (/usr/share/xdg-desktop-portal/
# niri-portals.conf). xdg-desktop-portal takes the first matching file
# wholesale — no merging — so the vendor entries are restated here.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
# The gnome portal doesn't draw the file dialog itself — it delegates to
# Nautilus, which isn't installed (thunar setup), so every FileChooser call
# failed ("The name is not activatable"). The gtk backend renders its own.
org.freedesktop.impl.portal.FileChooser=gtk;
