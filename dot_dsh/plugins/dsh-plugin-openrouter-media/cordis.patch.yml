# Bundle patch for dsh-plugin-openrouter-media.
#
# Declared via `"dsh": { "bundle": { "patch": "./cordis.patch.yml" } }` in
# package.json so that `dsh plugin --profile web add link:<path>` wires this
# plugin as a profile layer automatically — no manual cordis.patch.yml editing
# required.
#
# Users override config by targeting the `openrouter-media` id in their own
# patch layer (~/.dsh/profiles/web/cordis.patch.yml); a config override
# replaces the whole config object, so restate any keys you wish to keep.
- insert:
    - id: openrouter-media
      name: 'dsh-plugin-openrouter-media'
      config: {}
