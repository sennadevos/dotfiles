# dsh (DeepSeek Harness) settings — hot-reloaded.
# OpenRouter is a first-class pi-ai route: endpoint, protocol, and the full
# model catalog are inherited from the installed catalog. Do NOT add a
# `models:` list here — it REPLACES the catalog instead of extending it.
llm-pi-ai:
  providers:
    openrouter:
      apiKeyEnv: OPENROUTER_API_KEY
    # Hand-declared overflow route for models newer than the installed
    # catalog snapshot; delete entries here once a dsh update ships them
    # in the openrouter catalog itself.
    openrouter-fresh:
      displayName: OpenRouter (fresh)
      apiKeyEnv: OPENROUTER_API_KEY
      api: openai-completions
      baseURL: https://openrouter.ai/api/v1
      compat:
        supportsDeveloperRole: false
        thinkingFormat: openrouter
      models:
        - id: google/gemini-3.7-flash
          name: Gemini 3.7 Flash
          contextWindow: 1048576
          maxTokens: 65536
          # No `off:` level — Gemini 3.7 Flash has mandatory reasoning and
          # rejects requests that explicitly disable it.
          reasoningEfforts:
            low: low
            medium: medium
            high: high

# The key itself lives in ~/.dsh/.credentials.yaml, which is deliberately NOT
# managed by chezmoi (local-only secret; see .chezmoiignore). On a new machine
# recreate it as:
#   version: 1
#   refs:
#     OPENROUTER_API_KEY: <key>

agent-default-model:
  provider: openrouter-fresh
  model: google/gemini-3.7-flash
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
